name: qwaudio-graphiti
services:
  neo4j:
    image: ${QWEN_AUDIO_GRAPHITI_NEO4J_IMAGE:-neo4j:5.26.0}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${GRAPHITI_NEO4J_PASSWORD:?Graphiti database password is required}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:${GRAPHITI_NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${GRAPHITI_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
volumes:
  neo4j-data:
